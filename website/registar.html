
<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acesso à plataforma ParkWise.">
    <title>Criar Conta | ParkWise</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="register-page">

    <header class="header">
        <nav class="navbar container">

            <a href="index.html" class="logo">
                <span class="logo-icon">P</span>
                <span>Park<span class="logo-highlight">Wise</span></span>
            </a>

            <a href="index.html" class="login-back">
                ← Voltar ao início
            </a>

        </nav>
    </header>

    <main class="register-main">

        <section class="register-card">

            <span class="section-tag">CRIAR CONTA</span>

            <h1>Bem-vindo ao ParkWise.</h1>

            <p class="register-description">
                Crie uma conta para poder aceder à sua área reservada.                
            </p>

            <form id="register-form">

                <div class="register-field">
                    <label for="nome">Nome Completo</label>

                    <input
                        id="nome"
                        name="nome"
                        type="text"
                        placeholder="Introduza o seu nome completo"
                        autocomplete="name"
                        required>
                </div>

                <div class="register-field">
                    <label for="email">Email</label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="nome@exemplo.pt"
                        autocomplete="email"
                        required>
                </div>

                <div class="register-field">
                    <label for="password">Palavra-passe</label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Introduza a sua palavra-passe"
                        autocomplete="password"
                        required>
                </div>

                <div class="register-field">
                    <label for="confirm-password">Confirmar Palavra-passe</label>

                    <input
                        id="confirm-password"
                        name="confirm-password"
                        type="password"
                        placeholder="Confirme a sua palavra-passe"
                        autocomplete="password"
                        required>
                </div>
                
                <button type="submit" class="btn btn-primary login-submit">
                    Criar Conta
                </button>

                <p id="login-message" class="login-message"
                   role="status" aria-live="polite"></p>

            </form>

            <p class="login-footnote">
                Acesso destinado a utilizadores autorizados.
            </p>

        </section>

    </main>

    <footer class="footer">
        <div class="container footer-content">

            <a href="index.html" class="logo">
                <span class="logo-icon">P</span>
                <span>Park<span class="logo-highlight">Wise</span></span>
            </a>

            <p>
                © <span id="current-year"></span>
                ParkWise · Sistemas de Apoio à Decisão
            </p>

            <a href="index.html" class="back-top">
                Voltar ao início
            </a>

        </div>
    </footer>

    <script src="js/script.js"></script>
    <script src="js/register.js"></script>
</body>
    


</html>
